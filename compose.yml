#       context: ./privoxy
#       network: host
#       args:
#         HTTP_PROXY: http://127.0.0.1:8118
#         HTTPS_PROXY: http://127.0.0.1:8118
#     container_name: privoxy
#     restart: unless-stopped
#     networks:
#       - log-analyzer

  clickhouse:
    image: clickhouse/clickhouse-server
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: ${CH_DB}
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - ./clickhouse-volume:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      retries: 10
    networks:
      - log-analyzer

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    environment:
      CH_DB: ${CH_DB}
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./otel/otel-config.yml:/etc/otelcol/config.yaml:ro
      - /var/www/bsmsc/storage/logs:/logs
      - ./otel-storage-volume:/var/lib/otelcol/storage
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - log-analyzer

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   environment:
  #     HTTP_PROXY: http://host.docker.internal:8118
  #     HTTPS_PROXY: http://host.docker.internal:8118
  #     http_proxy: http://host.docker.internal:8118
  #     https_proxy: http://host.docker.internal:8118
  #     NO_PROXY: localhost,127.0.0.1,ollama
  #     no_proxy: localhost,127.0.0.1,ollama
  #   volumes:
  #     - ollama:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   networks:
  #     - log-analyzer
    # GPU (optional):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

    ollama:
      image: ollama/ollama:latest
      container_name: ollama
      network_mode: host
      environment:
        OLLAMA_HOST: 127.0.0.1:11434
        HTTP_PROXY: http://127.0.0.1:8118
        HTTPS_PROXY: http://127.0.0.1:8118
        http_proxy: http://127.0.0.1:8118
        https_proxy: http://127.0.0.1:8118
      volumes:
        - ollama:/root/.ollama
      ports:
        - "11434:11434"
      networks:
        - log-analyzer

  log-analyzer:
    build: 
      context: ./langchain
      network: host
    image: log-analyzer-app
    container_name: log-analyzer
    depends_on: [clickhouse, ollama]
    ports: ["8000:8000"]
    volumes:
      - ./langchain:/app
    environment:
      CH_HOST: ${CH_HOST}
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}
      CH_DB: ${CH_DB}
      OLLAMA_URL: http://ollama:11434
      MODEL: qwen2.5-coder:7b
      MODELS: qwen2.5-coder:7b,qwen2.5-coder:14b,sqlcoder:7b
    stdin_open: true
    tty: true
    networks:
      - log-analyzer

volumes:
  ollama:

networks:
  log-analyzer:
    name: log-analyzer
    driver: bridge