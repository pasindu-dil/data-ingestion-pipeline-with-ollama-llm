<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text to Query</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem}
 textarea{width:100%;height:80px;padding:.6rem;box-sizing:border-box}
 select,button{padding:.5rem .9rem;margin-top:.5rem}
 pre{background:#f3f3f3;padding:.8rem;overflow:auto;border-radius:6px}
 .tbl{overflow:auto;max-height:420px}
 table{border-collapse:collapse;width:100%;font-size:.9rem}
 th,td{border:1px solid #ccc;padding:.3rem .5rem;text-align:left;white-space:nowrap}
 th{background:#fafafa;position:sticky;top:0}
 .err{color:#b00020}
</style></head><body>
<h2>Text to Query</h2>
<textarea id="q" placeholder="e.g. Show error count per hour for the last 24 hours"></textarea><br>
<select id="src" title="data source"></select>
<select id="m" title="model"></select>
<button id="go">Ask</button> <span id="st"></span>
<h4>Query</h4><pre id="sql"></pre>
<h4>Result</h4><div class="tbl"><table id="t"></table></div>
<script>
const API = '/api/v1';
const $ = id => document.getElementById(id);
fetch(API + '/models').then(r => r.json()).then(d => {
  d.sources.forEach(x => {
    const o = document.createElement('option');
    o.value = o.textContent = x; if (x === d.default_source) o.selected = true;
    $('src').appendChild(o);
  });
  d.allowed.forEach(m => {
    const o = document.createElement('option');
    o.value = o.textContent = m; if (m === d.default) o.selected = true;
    $('m').appendChild(o);
  });
});
$('go').onclick = async () => {
  $('st').className = ''; $('st').textContent = 'Thinking...';
  $('sql').textContent = ''; $('t').replaceChildren();
  try {
    const r = await fetch(API + '/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: $('q').value, model: $('m').value, source: $('src').value})});
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail));
    $('sql').textContent = d.sql;
    const head = document.createElement('tr');
    d.columns.forEach(c => { const th = document.createElement('th'); th.textContent = c; head.appendChild(th); });
    $('t').appendChild(head);
    d.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(v => { const td = document.createElement('td'); td.textContent = v === null ? '' : (typeof v === 'object' ? JSON.stringify(v) : v); tr.appendChild(td); });
      $('t').appendChild(tr);
    });
    $('st').textContent = d.row_count + ' rows, ' + d.attempts + ' attempt(s)';
  } catch (e) { $('st').className = 'err'; $('st').textContent = e.message; }
};
</script></body></html>
